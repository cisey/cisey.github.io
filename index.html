<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cihan · Projeler</title>

<!-- Sayfa açılırken tema yanıp sönmesini önler -->
<script>
  (function() {
    const saved = localStorage.getItem('tema');
    if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  })();
</script>

<!-- Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #faf8f5;
  --surface-hover: #f2eee7;
  --icon-bg: #f0ebe2;
  --border: #e6e0d6;
  --text-main: #1c1917;
  --text-muted: #78716c;
  --text-faint: #a8a29e;
  --accent: #b45309;
}

[data-theme="dark"] {
  --bg: #141312;
  --surface-hover: #1e1c1a;
  --icon-bg: #221f1d;
  --border: #2a2724;
  --text-main: #f3efe8;
  --text-muted: #9e978e;
  --text-faint: #67615a;
  --accent: #e09f5a;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background-color: var(--bg);
  color: var(--text-main);
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;
  transition: background-color 0.25s ease, color 0.25s ease;
}

.container {
  width: 100%;
  max-width: 640px;
  margin: 0 auto;
  padding: 64px 24px 48px;
  flex: 1;
  display: flex;
  flex-direction: column;
}

/* Üst Alan */
.header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 40px;
}

h1 {
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.025em;
  line-height: 1.25;
}

p.desc {
  color: var(--text-muted);
  font-size: 14.5px;
  margin-top: 6px;
  line-height: 1.5;
}

/* Tema Butonu */
.theme-btn {
  flex-shrink: 0;
  width: 38px;
  height: 38px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
}

.theme-btn:hover {
  background-color: var(--surface-hover);
  color: var(--text-main);
}

.theme-btn svg {
  width: 18px;
  height: 18px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.icon-sun { display: none; }
[data-theme="dark"] .icon-sun { display: block; }
[data-theme="dark"] .icon-moon { display: none; }

/* Ultra Sade Liste */
.list {
  border-top: 1px solid var(--border);
}

.item {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 18px 12px;
  margin: 0 -12px;
  border-bottom: 1px solid var(--border);
  border-radius: 12px;
  text-decoration: none;
  color: inherit;
  transition: background-color 0.18s ease;
}

.item:hover {
  background-color: var(--surface-hover);
}

.item-icon {
  flex-shrink: 0;
  width: 38px;
  height: 38px;
  border-radius: 10px;
  background-color: var(--icon-bg);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  transition: background-color 0.25s ease;
}

.item-body {
  flex: 1;
  min-width: 0;
}

.item-title {
  font-size: 15.5px;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--text-main);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.item-desc {
  font-size: 13.5px;
  color: var(--text-muted);
  margin-top: 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.item-right {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 12px;
}

.item-date {
  font-size: 12px;
  color: var(--text-faint);
  font-variant-numeric: tabular-nums;
}

.item-arrow {
  color: var(--text-faint);
  font-size: 16px;
  transition: transform 0.2s ease, color 0.2s ease;
}

.item:hover .item-arrow {
  color: var(--accent);
  transform: translateX(3px);
}

/* Durum Mesajı */
.state-msg {
  text-align: center;
  color: var(--text-muted);
  padding: 48px 0;
  font-size: 14px;
}

/* Alt Bilgi */
.footer {
  margin-top: auto;
  padding-top: 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 13px;
  color: var(--text-faint);
}

.footer a {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--text-muted);
  text-decoration: none;
  transition: color 0.2s ease;
}

.footer a:hover {
  color: var(--text-main);
}

.footer svg {
  width: 15px;
  height: 15px;
  fill: currentColor;
}

/* Mobil Uyum */
@media (max-width: 480px) {
  .container { padding: 40px 20px 36px; }
  .header { margin-bottom: 28px; }
  .item { padding: 16px 8px; margin: 0 -8px; gap: 12px; }
  .item-date { display: none; }
}
</style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div>
        <h1>Projelerim</h1>
        <p class="desc">Bir projeye dokunun, açılsın.</p>
      </div>
      <button id="themeToggle" class="theme-btn" type="button" aria-label="Temayı değiştir" title="Temayı değiştir">
        <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
    </header>

    <main id="list" class="list">
      <div class="state-msg">Yükleniyor…</div>
    </main>

    <footer class="footer">
      <span>Cihan</span>
      <a href="https://github.com/cisey" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56 0-.28-.01-1.02-.02-2-3.2.7-3.88-1.54-3.88-1.54-.52-1.33-1.28-1.69-1.28-1.69-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.25.73-1.54-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11.05 11.05 0 0 1 5.79 0c2.21-1.49 3.18-1.18 3.18-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.84 1.19 3.1 0 4.42-2.69 5.39-5.26 5.68.41.36.78 1.06.78 2.14 0 1.55-.01 2.79-.01 3.17 0 .31.21.68.8.56A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/></svg>
        github.com/cisey
      </a>
    </footer>
  </div>

  <script>
    // Tema değiştirme
    const themeBtn = document.getElementById('themeToggle');
    themeBtn.addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      if (isDark) {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('tema', 'light');
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('tema', 'dark');
      }
    });

    const KULLANICI = 'cisey';
    const YEDEK = [{ name: 'local-radar-output', description: 'Local Radar çıktıları' }];

    // Üstte görünmesini istediğin projeler (küçük harfle, sırayla)
    const SIRA = ['localradar', 'phrasalverbs'];

    // Kısa açıklamalar
    const ACIKLAMA = {
      'localradar': 'İlçe ilçe yemek rehberleri',
      'phrasalverbs': 'İngilizce phrasal verb rehberi'
    };

    // Projeye özel ikonlar (listede olmayanlara varsayılan ikon atanır)
    const IKON = {
      'localradar': '📍',
      'phrasalverbs': '📖'
    };
    const VARSAYILAN_IKON = '✦';

    const list = document.getElementById('list');
    const tarihFormat = new Intl.DateTimeFormat('tr-TR', { month: 'short', year: 'numeric' });

    function ad(n) {
      return n.replace(/[-_]+/g, ' ').replace(/\b\p{L}/gu, c => c.toLocaleUpperCase('tr'));
    }

    function sira(r) {
      const i = SIRA.indexOf(r.name.toLowerCase());
      return i === -1 ? 999 : i;
    }

    function tarih(r) {
      const t = r.pushed_at || r.updated_at;
      if (!t) return '';
      const d = new Date(t);
      return isNaN(d) ? '' : tarihFormat.format(d);
    }

    function ciz(repolar) {
      list.innerHTML = '';
      if (!repolar.length) {
        list.innerHTML = '<div class="state-msg">Henüz yayınlanmış proje yok.</div>';
        return;
      }
      repolar = repolar.slice().sort((a, b) => sira(a) - sira(b));
      repolar.forEach(r => {
        const key = r.name.toLowerCase();
        const aciklama = ACIKLAMA[key] || r.description || '';
        const ikon = IKON[key] || VARSAYILAN_IKON;
        const guncelleme = tarih(r);

        const a = document.createElement('a');
        a.className = 'item';
        a.href = '/' + r.name + '/';
        a.innerHTML = `
          <div class="item-icon">${ikon}</div>
          <div class="item-body">
            <div class="item-title">${ad(r.name)}</div>
            ${aciklama ? `<div class="item-desc">${aciklama}</div>` : ''}
          </div>
          <div class="item-right">
            ${guncelleme ? `<span class="item-date">${guncelleme}</span>` : ''}
            <span class="item-arrow">→</span>
          </div>
        `;
        list.appendChild(a);
      });
    }

    fetch('https://api.github.com/users/' + KULLANICI + '/repos?per_page=100&sort=updated')
      .then(r => { if (!r.ok) throw 0; return r.json(); })
      .then(d => {
        const p = d.filter(r => r.has_pages && !r.fork && r.name.toLowerCase() !== KULLANICI + '.github.io');
        ciz(p.length ? p : YEDEK);
      })
      .catch(() => ciz(YEDEK));
  </script>
</body>
</html>
